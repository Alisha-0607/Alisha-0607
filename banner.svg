<svg width="100%" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3F1FB">
        <animate attributeName="stop-color" values="#E3F1FB;#D6E4FB;#E3F1FB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#C9DDF7">
        <animate attributeName="stop-color" values="#C9DDF7;#BFE8DF;#C9DDF7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D6E4FB">
        <animate attributeName="stop-color" values="#D6E4FB;#E3F1FB;#D6E4FB" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A7DE0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2FA595" stop-opacity="0.22"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" fill="url(#bgGrad)"/>

  <!-- Soft waves -->
  <path d="M0,190 C150,150 300,220 500,190 C700,160 850,210 1000,180 L1000,280 L0,280 Z" fill="url(#waveGrad1)">
    <animate attributeName="d"
      values="M0,190 C150,150 300,220 500,190 C700,160 850,210 1000,180 L1000,280 L0,280 Z;
              M0,200 C150,230 300,160 500,200 C700,230 850,170 1000,200 L1000,280 L0,280 Z;
              M0,190 C150,150 300,220 500,190 C700,160 850,210 1000,180 L1000,280 L0,280 Z"
      dur="10s" repeatCount="indefinite"/>
  </path>

  <path d="M0,220 C200,190 350,250 550,220 C750,190 900,240 1000,215 L1000,280 L0,280 Z" fill="url(#waveGrad2)">
    <animate attributeName="d"
      values="M0,220 C200,190 350,250 550,220 C750,190 900,240 1000,215 L1000,280 L0,280 Z;
              M0,230 C200,255 350,200 550,235 C750,260 900,205 1000,235 L1000,280 L0,280 Z;
              M0,220 C200,190 350,250 550,220 C750,190 900,240 1000,215 L1000,280 L0,280 Z"
      dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- Faint glyphs: code, AI, braces, and a medical cross drawn from shapes -->
  <g opacity="0.16" fill="#1F3A5F" font-family="Consolas, monospace" font-weight="700">
    <text x="55" y="70" font-size="34">&lt;/&gt;</text>
    <text x="880" y="60" font-size="30">AI</text>
    <text x="60" y="235" font-size="28">{ }</text>
  </g>


  <!-- Creative accents: paint dabs, star, brush stroke -->
  <g>
    <circle cx="905" cy="225" r="9" fill="#5A7DE0" opacity="0.35"/>
    <circle cx="928" cy="215" r="7" fill="#2FA595" opacity="0.35"/>
    <circle cx="945" cy="232" r="6" fill="#6FA8DC" opacity="0.45"/>
    <path d="M150,40 L154,52 L166,56 L154,60 L150,72 L146,60 L134,56 L146,52 Z" fill="#FFFFFF" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" values="0 150 56;90 150 56" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M40,200 C70,180 90,215 120,195 C145,178 165,205 190,190" fill="none" stroke="#5A7DE0" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
  </g>

  <!-- Sparkles -->
  <g>
    <circle cx="120" cy="55" r="10" fill="url(#sparkleGlow)"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="95" r="7" fill="url(#sparkleGlow)"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="45" r="5" fill="url(#sparkleGlow)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="115" r="5" fill="url(#sparkleGlow)"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="40" r="6" fill="url(#sparkleGlow)"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="150" r="4" fill="url(#sparkleGlow)"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="160" r="6" fill="url(#sparkleGlow)"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Name -->
  <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', 'Poppins', sans-serif"
        font-size="56" font-weight="700" fill="#1F3A5F" filter="url(#softGlow)">
    Alisha Sawant
    <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0s" fill="freeze"/>
  </text>

  <!-- Tagline -->
  <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI', 'Poppins', sans-serif"
        font-size="19" font-weight="500" fill="#35597F" letter-spacing="0.5">
    Building creative software with code &amp; AI
    <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- Subtext -->
  <text x="500" y="196" text-anchor="middle" font-family="'Segoe UI', 'Poppins', sans-serif"
        font-size="14" fill="#4C6F94" letter-spacing="0.4">
    Electronics &amp; Computer Science · Backend · AI/ML · Creative &amp; Chic
    <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.8s" fill="freeze"/>
  </text>

  <!-- Decorative underline -->
  <line x1="400" y1="212" x2="600" y2="212" stroke="#5A7DE0" stroke-width="1.5" opacity="0.6">
    <animate attributeName="x1" values="500;400;500" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="500;600;500" dur="6s" repeatCount="indefinite"/>
  </line>
</svg>
