name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Alisha-0607

          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%235A7DE0&color_dots=%23EAF3FB,%23C9DDF7,%238FB4EE,%235A7DE0,%232FA595

            dist/snake-dark.svg?palette=github-dark&color_snake=%238FB4EE&color_dots=%2316202E,%231F3A5F,%235A7DE0,%238FB4EE,%2362D2BF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
