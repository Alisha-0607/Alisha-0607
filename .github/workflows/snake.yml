name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Alisha-0607

          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%230B0B0F&color_dots=%23EDEDED,%23F7B3B8,%23F0707A,%23E8101F,%239E0A14

            dist/snake-dark.svg?palette=github-dark&color_snake=%23FFFFFF&color_dots=%231C1C22,%235A0A10,%239E0A14,%23E8101F,%23FF6B76

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
